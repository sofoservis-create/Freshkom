openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead capture operations
  - name: reviews
    description: Google reviews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: submitLead
      tags: [leads]
      summary: Submit a lead inquiry
      description: Captures a customer inquiry for a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadSubmission"
      responses:
        "201":
          description: Lead submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSubmissionResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reviews:
    get:
      operationId: getGoogleReviews
      tags: [reviews]
      summary: Get current Google rating and public reviews
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            enum: [sk, hu]
            default: sk
      responses:
        "200":
          description: Google rating and available reviews (cached for 24 hours)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleReviewsResponse"
        "503":
          description: Google Places data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    GoogleReview:
      type: object
      required: [name, text, rating, date, authorUrl]
      properties:
        name: { type: string }
        text: { type: string }
        rating: { type: integer }
        date: { type: string }
        authorUrl: { type: string }
    GoogleReviewsResponse:
      type: object
      required: [rating, reviewCount, reviews, mapsUrl]
      properties:
        rating: { type: number }
        reviewCount: { type: integer }
        mapsUrl: { type: string }
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/GoogleReview"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadSubmission:
      type: object
      properties:
        name:
          type: string
          description: Full name of the customer
        phone:
          type: string
          description: Phone number
        email:
          type: string
          description: Email address
        service:
          type: string
          description: Type of service requested
          enum:
            - tepovanie-gaucov
            - tepovanie-kobercov
            - tepovanie-matracov
            - tepovanie-aut
            - cistenie-caluneneho-nabytku
            - umyvanie-okien
            - hlbkove-cistenie
            - ine
        message:
          type: string
          description: Additional message or details
      required:
        - name
        - phone
        - service
    LeadSubmissionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: integer
      required:
        - success
        - message
        - id
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
